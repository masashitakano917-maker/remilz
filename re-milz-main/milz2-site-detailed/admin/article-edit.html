<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>記事追加・編集｜Milz2 Admin</title>
  <meta name="theme-color" content="#00327f" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body" data-admin-current="articles">
  <div class="admin-shell">
    <aside class="admin-sidebar">
  <a class="admin-logo" href="index.html">Milz2<small>Admin Console</small></a>
  <nav class="admin-menu">
    <a href="index.html" data-admin="dashboard">ダッシュボード</a>
    <a href="inquiries.html" data-admin="inquiries">お問い合わせ</a>
    <a href="articles.html" data-admin="articles">記事管理</a>
    <a href="users.html" data-admin="users">登録者管理</a>
    <a href="emails.html" data-admin="emails">一括メール</a>
    <div class="sep"></div>
    <a href="jobs.html" data-admin="jobs">求人管理</a>
    <a href="companies.html" data-admin="companies">企業管理</a>
    <a href="checklists.html" data-admin="checklists">チェックリスト</a>
    <a href="analytics.html" data-admin="analytics">分析</a>
    <a href="settings.html" data-admin="settings">設定</a>
    <a href="audit-log.html" data-admin="audit">操作ログ</a>
    <div class="sep"></div>
    <a href="../index.html">公開サイトへ</a>
  </nav>
  <div class="admin-side-note">管理画面はSupabaseに接続されています。</div>
</aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-title"><h1 id="page-title">記事追加</h1><p>Milz2 管理画面</p></div>
        <div class="admin-actions"><a class="btn btn-outline btn-mini" href="articles.html">戻る</a><a class="btn btn-primary btn-mini" id="logout-btn" href="#">ログアウト</a></div>
      </header>
      <div class="admin-content">
        <section class="admin-panel">
          <div id="msg" style="display:none;padding:12px;border-radius:6px;margin-bottom:16px;font-size:14px"></div>
          <form class="admin-form" id="article-form">
            <label>タイトル<input id="title" required></label>
            <div class="admin-form-grid">
              <label>カテゴリ<select id="category">
                <option value="手続き">手続き</option>
                <option value="税金・お金">税金・お金</option>
                <option value="住まい">住まい</option>
                <option value="教育">教育</option>
                <option value="引越し">引越し</option>
                <option value="求人">求人</option>
                <option value="保険">保険</option>
                <option value="生活">生活</option>
                <option value="FAQ">FAQ</option>
                <option value="法人">法人</option>
              </select></label>
              <label>公開状態<select id="status">
                <option value="draft">下書き</option>
                <option value="published">公開</option>
              </select></label>
            </div>
            <label>概要<textarea id="excerpt" rows="3"></textarea></label>
            <label>本文 (HTML)<textarea id="content" rows="12" style="min-height:300px"></textarea></label>
            <button class="btn btn-primary" type="submit" id="submit-btn">保存する</button>
          </form>
        </section>
      </div>
    </main>
  </div>
<script type="module">
  import { requireAdmin, signOut } from '../js/auth.js';
  import { createArticle, updateArticle } from '../js/admin-data.js';
  import { supabase } from '../js/supabase.js';

  const current = document.body.dataset.adminCurrent;
  document.querySelectorAll('[data-admin]').forEach(a => { if(a.dataset.admin === current) a.classList.add('active'); });

  const params = new URLSearchParams(window.location.search);
  const articleId = params.get('id');
  const form = document.getElementById('article-form');
  const msg = document.getElementById('msg');

  (async () => {
    const profile = await requireAdmin();
    if (!profile) return;

    if (articleId) {
      document.getElementById('page-title').textContent = '記事編集';
      const { data: article } = await supabase.from('articles').select('*').eq('id', articleId).maybeSingle();
      if (article) {
        document.getElementById('title').value = article.title;
        document.getElementById('category').value = article.category;
        document.getElementById('status').value = article.status;
        document.getElementById('excerpt').value = article.excerpt || '';
        document.getElementById('content').value = article.content || '';
      }
    }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.style.display = 'none';
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;

    const articleData = {
      title: document.getElementById('title').value,
      category: document.getElementById('category').value,
      status: document.getElementById('status').value,
      excerpt: document.getElementById('excerpt').value,
      content: document.getElementById('content').value,
      published_at: document.getElementById('status').value === 'published' ? new Date().toISOString() : null
    };

    try {
      if (articleId) {
        await updateArticle(articleId, articleData);
      } else {
        await createArticle(articleData);
      }
      msg.style.display = 'block';
      msg.style.color = 'var(--green)';
      msg.style.background = 'var(--green-bg)';
      msg.textContent = '保存しました。';
      setTimeout(() => { window.location.href = 'articles.html'; }, 1000);
    } catch (err) {
      msg.style.display = 'block';
      msg.style.color = 'var(--red)';
      msg.style.background = '#fef2f2';
      msg.textContent = `保存に失敗しました: ${err.message}`;
      submitBtn.disabled = false;
    }
  });

  document.getElementById('logout-btn')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await signOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
