<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>記事追加・編集｜CHAPTER JAPAN Admin</title>
  <meta name="theme-color" content="#00327f" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .article-editor-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 900px) {
      .article-editor-layout { grid-template-columns: 1fr; }
    }
    .editor-main { display: flex; flex-direction: column; gap: 20px; }
    .editor-sidebar { display: flex; flex-direction: column; gap: 20px; }
    .editor-sidebar .sidebar-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 20px;
    }
    .sidebar-card h3 {
      font-size: 13px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }
    .sidebar-card label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .sidebar-card input,
    .sidebar-card select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 14px;
    }
    .sidebar-card .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .sidebar-card .checkbox-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
    }
    .image-drop-zone {
      border: 2px dashed #d1d5db;
      border-radius: 8px;
      padding: 24px 16px;
      text-align: center;
      color: #9ca3af;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }
    .image-drop-zone:hover,
    .image-drop-zone.dragover {
      border-color: var(--blue);
      background: #f0f7ff;
    }
    .image-drop-zone img {
      max-width: 100%;
      max-height: 160px;
      border-radius: 6px;
      object-fit: cover;
    }
    .image-drop-zone .drop-icon {
      font-size: 24px;
      margin-bottom: 4px;
    }
    .image-url-input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .btn-pexels {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: #05a081;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-pexels:hover { background: #048a6e; }

    .rich-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      padding: 8px 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-bottom: none;
      border-radius: 8px 8px 0 0;
    }
    .rich-toolbar button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
      transition: background 0.1s;
    }
    .rich-toolbar button:hover { background: #e5e7eb; }
    .rich-toolbar button.active { background: #dbeafe; color: var(--blue); }
    .rich-toolbar .sep {
      width: 1px;
      height: 24px;
      background: #d1d5db;
      margin: 4px 4px;
    }
    .rich-editor {
      min-height: 400px;
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 0 0 8px 8px;
      font-size: 15px;
      line-height: 1.7;
      outline: none;
      background: #fff;
    }
    .rich-editor:focus { border-color: var(--blue); }
    .rich-editor h1 { font-size: 24px; font-weight: 900; margin: 16px 0 8px; }
    .rich-editor h2 { font-size: 20px; font-weight: 800; margin: 14px 0 6px; }
    .rich-editor h3 { font-size: 17px; font-weight: 700; margin: 12px 0 4px; }
    .rich-editor p { margin: 0 0 12px; }
    .rich-editor ul, .rich-editor ol { margin: 0 0 12px 20px; }
    .rich-editor blockquote {
      border-left: 3px solid var(--blue);
      padding-left: 14px;
      margin: 12px 0;
      color: #6b7280;
    }
    .rich-editor a { color: var(--blue); text-decoration: underline; }
    .rich-editor img { max-width: 100%; border-radius: 6px; margin: 12px 0; }

    .editor-field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 6px;
    }
    .editor-field input,
    .editor-field textarea {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
    }
    .editor-field textarea { resize: vertical; min-height: 80px; }
    .slug-hint {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 4px;
    }
    .editor-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .editor-actions .btn { padding: 12px 28px; font-size: 14px; }
    .btn-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 10px;
      background: #fff;
      color: #374151;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
    }
    .btn-preview:hover { background: #f3f4f6; }
  </style>
</head>
<body class="admin-body" data-admin-current="articles">
  <div class="admin-shell">
    <aside class="admin-sidebar">
  <a class="admin-logo" href="index.html">CHAPTER JAPAN<small>Admin Console</small></a>
  <nav class="admin-menu">
    <a href="index.html" data-admin="dashboard">ダッシュボード</a>
    <a href="inquiries.html" data-admin="inquiries">お問い合わせ</a>
    <a href="articles.html" data-admin="articles">記事管理</a>
    <a href="users.html" data-admin="users">登録者管理</a>
    <a href="emails.html" data-admin="emails">一括メール</a>
    <div class="sep"></div>
    <a href="jobs.html" data-admin="jobs">求人管理</a>
    <a href="companies.html" data-admin="companies">企業管理</a>
    <a href="checklists.html" data-admin="checklists">チェックリスト</a>
    <a href="analytics.html" data-admin="analytics">分析</a>
    <a href="settings.html" data-admin="settings">設定</a>
    <a href="audit-log.html" data-admin="audit">操作ログ</a>
    <div class="sep"></div>
    <a href="../index.html">公開サイトへ</a>
  </nav>
  <div class="admin-side-note">管理画面はSupabaseに接続されています。</div>
</aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-title"><h1 id="page-title">新規記事を作成</h1><p>CHAPTER JAPAN 管理画面</p></div>
        <div class="admin-actions"><a class="btn btn-outline btn-mini" href="articles.html">戻る</a><a class="btn btn-primary btn-mini" id="logout-btn" href="#">ログアウト</a></div>
      </header>
      <div class="admin-content">
        <div id="msg" style="display:none;padding:12px;border-radius:6px;margin-bottom:16px;font-size:14px"></div>

        <div class="article-editor-layout">
          <!-- Left: Content -->
          <div class="editor-main">
            <div class="editor-field">
              <label for="title">タイトル</label>
              <input id="title" type="text" placeholder="記事タイトルを入力" required>
            </div>

            <div class="editor-field">
              <label for="slug">スラッグ (URL)</label>
              <input id="slug" type="text" placeholder="how-to-move-back-to-japan">
              <p class="slug-hint">URLに使用されます。空欄の場合はタイトルから自動生成されます。</p>
            </div>

            <div class="editor-field">
              <label for="excerpt">概要</label>
              <textarea id="excerpt" rows="3" placeholder="記事の概要を入力（一覧ページに表示されます）"></textarea>
            </div>

            <div class="editor-field">
              <label>本文</label>
              <div class="rich-toolbar" id="toolbar">
                <button type="button" data-cmd="bold" title="太字"><b>B</b></button>
                <button type="button" data-cmd="italic" title="斜体"><i>I</i></button>
                <button type="button" data-cmd="underline" title="下線"><u>U</u></button>
                <button type="button" data-cmd="strikeThrough" title="取り消し線"><s>S</s></button>
                <div class="sep"></div>
                <button type="button" data-cmd="formatBlock" data-val="h1" title="見出し1">H1</button>
                <button type="button" data-cmd="formatBlock" data-val="h2" title="見出し2">H2</button>
                <button type="button" data-cmd="formatBlock" data-val="h3" title="見出し3">H3</button>
                <button type="button" data-cmd="formatBlock" data-val="p" title="本文">P</button>
                <div class="sep"></div>
                <button type="button" data-cmd="insertUnorderedList" title="箇条書き">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1" fill="currentColor"/><circle cx="3" cy="12" r="1" fill="currentColor"/><circle cx="3" cy="18" r="1" fill="currentColor"/></svg>
                </button>
                <button type="button" data-cmd="insertOrderedList" title="番号付きリスト">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="2" y="8" font-size="8" fill="currentColor" stroke="none">1</text><text x="2" y="14" font-size="8" fill="currentColor" stroke="none">2</text><text x="2" y="20" font-size="8" fill="currentColor" stroke="none">3</text></svg>
                </button>
                <button type="button" data-cmd="formatBlock" data-val="blockquote" title="引用">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 17h3l2-4V7H5v6h3M15 17h3l2-4V7h-6v6h3"/></svg>
                </button>
                <div class="sep"></div>
                <button type="button" data-cmd="insertHorizontalRule" title="水平線">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="12" x2="22" y2="12"/></svg>
                </button>
                <button type="button" id="btn-link" title="リンク挿入">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                </button>
                <button type="button" id="btn-image" title="画像挿入">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                </button>
                <div class="sep"></div>
                <button type="button" data-cmd="undo" title="元に戻す">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
                <button type="button" data-cmd="redo" title="やり直し">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
                </button>
              </div>
              <div class="rich-editor" id="editor" contenteditable="true"></div>
            </div>

            <div class="editor-actions">
              <button class="btn btn-primary" type="button" id="submit-btn">作成する</button>
              <button class="btn btn-outline" type="button" id="draft-btn">下書き保存</button>
            </div>
          </div>

          <!-- Right: Metadata -->
          <div class="editor-sidebar">
            <div class="sidebar-card">
              <h3>アイキャッチ画像</h3>
              <input class="image-url-input" id="featured-image-url" type="text" placeholder="URLを入力 または 画像をドロップ">
              <button class="btn-pexels" type="button" id="btn-pexels">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                Pexels から画像を選択
              </button>
              <div class="image-drop-zone" id="image-drop">
                <div class="drop-icon">&#8679;</div>
                <span>ドラッグ&ドロップ or クリック</span>
              </div>
            </div>

            <div class="sidebar-card">
              <h3>記事設定</h3>
              <label for="category">カテゴリ</label>
              <select id="category">
                <option value="手続き">手続き</option>
                <option value="税金・お金">税金・お金</option>
                <option value="住まい">住まい</option>
                <option value="教育">教育</option>
                <option value="引越し">引越し</option>
                <option value="求人">求人</option>
                <option value="保険">保険</option>
                <option value="生活">生活</option>
                <option value="FAQ">FAQ</option>
                <option value="法人">法人</option>
              </select>

              <label for="author">著者</label>
              <input id="author" type="text" placeholder="著者名">

              <label for="published-at">公開日</label>
              <input id="published-at" type="date">

              <div class="checkbox-row">
                <input type="checkbox" id="is-published">
                <label for="is-published" style="margin:0">公開する</label>
              </div>
              <div class="checkbox-row">
                <input type="checkbox" id="is-featured">
                <label for="is-featured" style="margin:0">注目記事に設定</label>
              </div>
            </div>

            <button class="btn-preview" type="button" id="btn-preview">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              プレビュー
            </button>
          </div>
        </div>

      </div>
    </main>
  </div>
<script type="module">
  import { requireAdmin, signOut } from '../js/auth.js';
  import { createArticle, updateArticle } from '../js/admin-data.js';
  import { supabase } from '../js/supabase.js';

  const current = document.body.dataset.adminCurrent;
  document.querySelectorAll('[data-admin]').forEach(a => { if(a.dataset.admin === current) a.classList.add('active'); });

  const params = new URLSearchParams(window.location.search);
  const articleId = params.get('id');
  const msg = document.getElementById('msg');
  const editor = document.getElementById('editor');
  const titleInput = document.getElementById('title');
  const slugInput = document.getElementById('slug');
  const imageUrlInput = document.getElementById('featured-image-url');
  const imageDrop = document.getElementById('image-drop');

  function showMsg(text, success = true) {
    msg.style.display = 'block';
    msg.style.color = success ? 'var(--green)' : 'var(--red)';
    msg.style.background = success ? 'var(--green-bg)' : '#fef2f2';
    msg.textContent = text;
  }

  // Rich editor toolbar
  document.getElementById('toolbar').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    e.preventDefault();
    const cmd = btn.dataset.cmd;
    if (cmd) {
      const val = btn.dataset.val || null;
      document.execCommand(cmd, false, val);
      editor.focus();
    }
  });

  document.getElementById('btn-link').addEventListener('click', (e) => {
    e.preventDefault();
    const url = prompt('リンクURLを入力:');
    if (url) document.execCommand('createLink', false, url);
    editor.focus();
  });

  document.getElementById('btn-image').addEventListener('click', (e) => {
    e.preventDefault();
    const url = prompt('画像URLを入力:');
    if (url) document.execCommand('insertImage', false, url);
    editor.focus();
  });

  // Auto-generate slug from title
  titleInput.addEventListener('blur', () => {
    if (!slugInput.value && titleInput.value) {
      slugInput.value = titleInput.value
        .toLowerCase()
        .replace(/[^\w\s\u3000-\u9fff-]/g, '')
        .replace(/[\s\u3000]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '')
        .slice(0, 80);
    }
  });

  // Image drop zone
  imageUrlInput.addEventListener('input', () => {
    const url = imageUrlInput.value.trim();
    if (url) {
      imageDrop.innerHTML = `<img src="${url}" alt="preview">`;
    } else {
      imageDrop.innerHTML = '<div class="drop-icon">&#8679;</div><span>ドラッグ&ドロップ or クリック</span>';
    }
  });

  imageDrop.addEventListener('dragover', (e) => { e.preventDefault(); imageDrop.classList.add('dragover'); });
  imageDrop.addEventListener('dragleave', () => { imageDrop.classList.remove('dragover'); });
  imageDrop.addEventListener('drop', (e) => {
    e.preventDefault();
    imageDrop.classList.remove('dragover');
    const text = e.dataTransfer.getData('text/plain') || e.dataTransfer.getData('text/uri-list');
    if (text) {
      imageUrlInput.value = text;
      imageDrop.innerHTML = `<img src="${text}" alt="preview">`;
    }
  });

  // Pexels button
  document.getElementById('btn-pexels').addEventListener('click', () => {
    const query = prompt('Pexelsで検索するキーワード:', titleInput.value || '');
    if (query) {
      const pexelsUrl = `https://images.pexels.com/photos/3184291/pexels-photo-3184291.jpeg?auto=compress&cs=tinysrgb&w=800`;
      imageUrlInput.value = pexelsUrl;
      imageDrop.innerHTML = `<img src="${pexelsUrl}" alt="Pexels">`;
    }
  });

  // Preview
  document.getElementById('btn-preview').addEventListener('click', () => {
    const w = window.open('', '_blank');
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>プレビュー</title>
      <style>body{font-family:sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.8;color:#1f2937}
      img{max-width:100%;border-radius:8px}h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
      blockquote{border-left:3px solid #3b82f6;padding-left:16px;color:#6b7280}</style></head>
      <body><h1>${titleInput.value}</h1>${editor.innerHTML}</body></html>`);
    w.document.close();
  });

  // Load existing article
  (async () => {
    const profile = await requireAdmin();
    if (!profile) return;

    if (articleId) {
      document.getElementById('page-title').textContent = '記事を編集';
      document.getElementById('submit-btn').textContent = '更新する';
      const { data: article } = await supabase.from('articles').select('*').eq('id', articleId).maybeSingle();
      if (article) {
        titleInput.value = article.title;
        slugInput.value = article.slug || '';
        document.getElementById('category').value = article.category;
        document.getElementById('excerpt').value = article.excerpt || '';
        editor.innerHTML = article.content || '';
        document.getElementById('author').value = article.author || '';
        document.getElementById('is-published').checked = article.status === 'published';
        document.getElementById('is-featured').checked = article.is_featured || false;
        if (article.published_at) {
          document.getElementById('published-at').value = article.published_at.split('T')[0];
        }
        if (article.featured_image) {
          imageUrlInput.value = article.featured_image;
          imageDrop.innerHTML = `<img src="${article.featured_image}" alt="preview">`;
        }
      }
    } else {
      document.getElementById('published-at').value = new Date().toISOString().split('T')[0];
    }
  })();

  // Save
  async function saveArticle(forceDraft = false) {
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;
    msg.style.display = 'none';

    const isPublished = forceDraft ? false : document.getElementById('is-published').checked;
    const pubDate = document.getElementById('published-at').value;

    const articleData = {
      title: titleInput.value,
      slug: slugInput.value || null,
      category: document.getElementById('category').value,
      excerpt: document.getElementById('excerpt').value,
      content: editor.innerHTML,
      author: document.getElementById('author').value || null,
      featured_image: imageUrlInput.value || null,
      is_featured: document.getElementById('is-featured').checked,
      status: isPublished ? 'published' : 'draft',
      published_at: isPublished && pubDate ? new Date(pubDate).toISOString() : null
    };

    try {
      if (articleId) {
        await updateArticle(articleId, articleData);
      } else {
        await createArticle(articleData);
      }
      showMsg('保存しました。');
      setTimeout(() => { window.location.href = 'articles.html'; }, 1000);
    } catch (err) {
      showMsg(`保存に失敗しました: ${err.message}`, false);
      submitBtn.disabled = false;
    }
  }

  document.getElementById('submit-btn').addEventListener('click', () => saveArticle(false));
  document.getElementById('draft-btn').addEventListener('click', () => saveArticle(true));

  document.getElementById('logout-btn')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await signOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
