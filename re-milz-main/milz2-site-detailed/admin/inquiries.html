<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>お問い合わせ管理｜CHAPTER JAPAN Admin</title>
  <meta name="theme-color" content="#00327f" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body" data-admin-current="inquiries">
  <div class="admin-shell">
    <aside class="admin-sidebar">
  <a class="admin-logo" href="index.html">CHAPTER JAPAN<small>Admin Console</small></a>
  <nav class="admin-menu">
    <a href="index.html" data-admin="dashboard">ダッシュボード</a>
    <a href="inquiries.html" data-admin="inquiries">お問い合わせ</a>
    <a href="articles.html" data-admin="articles">記事管理</a>
    <a href="users.html" data-admin="users">登録者管理</a>
    <a href="emails.html" data-admin="emails">一括メール</a>
    <div class="sep"></div>
    <a href="jobs.html" data-admin="jobs">求人管理</a>
    <a href="companies.html" data-admin="companies">企業管理</a>
    <a href="checklists.html" data-admin="checklists">チェックリスト</a>
    <a href="analytics.html" data-admin="analytics">分析</a>
    <a href="settings.html" data-admin="settings">設定</a>
    <a href="audit-log.html" data-admin="audit">操作ログ</a>
    <div class="sep"></div>
    <a href="../index.html">公開サイトへ</a>
  </nav>
  <div class="admin-side-note">管理画面はSupabaseに接続されています。</div>
</aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-title"><h1>お問い合わせ管理</h1><p>CHAPTER JAPAN 管理画面</p></div>
        <div class="admin-actions"><a class="btn btn-outline btn-mini" href="settings.html">設定</a><a class="btn btn-primary btn-mini" href="login.html">ログアウト</a><div class="admin-user"><span class="admin-avatar">A</span>Admin</div></div>
      </header>
      <div class="admin-content">
        <section class="admin-panel"><div class="admin-toolbar"><div class="admin-tabs"><a class="admin-tab active" href="#">未対応</a><a class="admin-tab" href="#">対応中</a><a class="admin-tab" href="#">完了</a></div><div class="admin-search"><input type="search" placeholder="名前・メール・相談内容で検索"><button class="btn btn-primary btn-mini">検索</button></div></div>
<table class="admin-table"><thead><tr><th>受付日時</th><th>氏名</th><th>カテゴリ</th><th>内容</th><th>状態</th><th></th></tr></thead><tbody>
</tbody></table></section>
      </div>
    </main>
  </div>
<script type="module">
  import { requireAdmin, signOut } from '../js/auth.js';
  import { getAllInquiries, updateInquiryStatus } from '../js/admin-data.js';

  const current = document.body.dataset.adminCurrent;
  document.querySelectorAll('[data-admin]').forEach(a => { if(a.dataset.admin === current) a.classList.add('active'); });

  let currentFilter = '';

  (async () => {
    const profile = await requireAdmin();
    if (!profile) return;
    loadInquiries();
  })();

  const tabs = document.querySelectorAll('.admin-tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const text = tab.textContent;
      if (text.includes('未対応')) currentFilter = 'pending';
      else if (text.includes('対応中')) currentFilter = 'reviewing';
      else if (text.includes('完了')) currentFilter = 'resolved';
      else currentFilter = '';
      loadInquiries();
    });
  });

  async function loadInquiries() {
    const tbody = document.querySelector('.admin-table tbody');
    try {
      const inquiries = await getAllInquiries({ status: currentFilter });
      const statusLabels = { pending: '未対応', reviewing: '対応中', resolved: '完了' };
      const statusColors = { pending: 'red', reviewing: 'orange', resolved: 'green' };
      tbody.innerHTML = inquiries.map(inq => `
        <tr>
          <td>${new Date(inq.created_at).toLocaleString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(/\//g, '.')}</td>
          <td>${inq.name}</td>
          <td>${inq.category}</td>
          <td>${inq.title}</td>
          <td>
            <select data-id="${inq.id}" class="status-select" style="font-size:12px;padding:4px 8px;border-radius:4px;border:1px solid var(--line)">
              <option value="pending" ${inq.status === 'pending' ? 'selected' : ''}>未対応</option>
              <option value="reviewing" ${inq.status === 'reviewing' ? 'selected' : ''}>対応中</option>
              <option value="resolved" ${inq.status === 'resolved' ? 'selected' : ''}>完了</option>
            </select>
          </td>
          <td class="right"><a href="inquiry-detail.html?id=${inq.id}">詳細</a></td>
        </tr>
      `).join('');
      if (inquiries.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--muted)">該当するお問い合わせがありません</td></tr>';
      }
      tbody.querySelectorAll('.status-select').forEach(sel => {
        sel.addEventListener('change', async () => {
          await updateInquiryStatus(sel.dataset.id, sel.value);
        });
      });
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="6" style="color:var(--red)">読み込みエラー</td></tr>';
    }
  }

  document.querySelector('.admin-actions .btn-primary')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await signOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
