<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>記事管理｜CHAPTER JAPAN Admin</title>
  <meta name="theme-color" content="#00327f" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body" data-admin-current="articles">
  <div class="admin-shell">
    <aside class="admin-sidebar">
  <a class="admin-logo" href="index.html">CHAPTER JAPAN<small>Admin Console</small></a>
  <nav class="admin-menu">
    <a href="index.html" data-admin="dashboard">ダッシュボード</a>
    <a href="inquiries.html" data-admin="inquiries">お問い合わせ</a>
    <a href="articles.html" data-admin="articles">記事管理</a>
    <a href="users.html" data-admin="users">登録者管理</a>
    <a href="emails.html" data-admin="emails">一括メール</a>
    <div class="sep"></div>
    <a href="jobs.html" data-admin="jobs">求人管理</a>
    <a href="companies.html" data-admin="companies">企業管理</a>
    <a href="checklists.html" data-admin="checklists">チェックリスト</a>
    <a href="analytics.html" data-admin="analytics">分析</a>
    <a href="settings.html" data-admin="settings">設定</a>
    <a href="audit-log.html" data-admin="audit">操作ログ</a>
    <div class="sep"></div>
    <a href="../index.html">公開サイトへ</a>
  </nav>
  <div class="admin-side-note">管理画面はSupabaseに接続されています。</div>
</aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-title"><h1>記事管理</h1><p>CHAPTER JAPAN 管理画面</p></div>
        <div class="admin-actions"><a class="btn btn-outline btn-mini" href="settings.html">設定</a><a class="btn btn-primary btn-mini" href="login.html">ログアウト</a><div class="admin-user"><span class="admin-avatar">A</span>Admin</div></div>
      </header>
      <div class="admin-content">
        <section class="admin-panel"><div class="admin-toolbar"><div class="admin-tabs"><a class="admin-tab active" href="#">公開中</a><a class="admin-tab" href="#">下書き</a><a class="admin-tab" href="#">すべて</a></div><a class="btn btn-primary btn-mini" href="article-edit.html">新規記事を追加</a></div><table class="admin-table"><thead><tr><th style="width:40px"></th><th>タイトル</th><th>カテゴリ</th><th>著者</th><th>公開日</th><th>状態</th><th></th></tr></thead><tbody>
</tbody></table></section>
      </div>
    </main>
  </div>
<script type="module">
  import { requireAdmin, signOut } from '../js/auth.js';
  import { getAllArticles, deleteArticle } from '../js/admin-data.js';

  const current = document.body.dataset.adminCurrent;
  document.querySelectorAll('[data-admin]').forEach(a => { if(a.dataset.admin === current) a.classList.add('active'); });

  let currentStatus = 'published';

  (async () => {
    const profile = await requireAdmin();
    if (!profile) return;
    loadArticles();
  })();

  const tabs = document.querySelectorAll('.admin-tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const text = tab.textContent;
      if (text === '公開中') currentStatus = 'published';
      else if (text === '下書き') currentStatus = 'draft';
      else currentStatus = '';
      loadArticles();
    });
  });

  async function loadArticles() {
    const tbody = document.querySelector('.admin-table tbody');
    try {
      const articles = await getAllArticles({ status: currentStatus });
      tbody.innerHTML = articles.map(a => {
        const thumb = a.featured_image
          ? `<img src="${a.featured_image}" style="width:36px;height:36px;border-radius:4px;object-fit:cover">`
          : `<span style="display:inline-block;width:36px;height:36px;border-radius:4px;background:#f3f4f6"></span>`;
        const featured = a.is_featured ? ' <span style="color:#f59e0b;font-size:11px">&#9733;</span>' : '';
        return `
        <tr>
          <td>${thumb}</td>
          <td><a href="article-edit.html?id=${a.id}">${a.title}</a>${featured}</td>
          <td>${a.category}</td>
          <td>${a.author || '-'}</td>
          <td>${a.published_at ? new Date(a.published_at).toLocaleDateString('ja-JP').replace(/\//g, '.') : '未公開'}</td>
          <td><span class="admin-badge ${a.status === 'published' ? 'green' : 'gray'}">${a.status === 'published' ? '公開' : '下書き'}</span></td>
          <td class="right"><a href="article-edit.html?id=${a.id}">編集</a> / <a href="#" data-delete="${a.id}">削除</a></td>
        </tr>`;
      }).join('');
      if (articles.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--muted)">該当する記事がありません</td></tr>';
      }
      tbody.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          if (!confirm('この記事を削除しますか？')) return;
          await deleteArticle(btn.dataset.delete);
          loadArticles();
        });
      });
    } catch (e) {
      tbody.innerHTML = '<tr><td colspan="7" style="color:var(--red)">読み込みエラー</td></tr>';
    }
  }

  document.querySelector('.admin-actions .btn-primary')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await signOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
