<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login｜Milz2</title><link rel="stylesheet" href="../css/style.css"></head><body class="admin-body"><section class="admin-login"><div class="admin-login-card"><div class="admin-logo">Milz2<small>Admin Console</small></div><div id="error-msg" style="display:none;color:var(--red);background:#fef2f2;padding:12px;border-radius:6px;margin-bottom:16px;font-size:14px"></div><form class="admin-form" id="admin-login-form"><label>メールアドレス<input type="email" id="email" placeholder="admin@example.com" required></label><label>パスワード<input type="password" id="password" placeholder="password" required></label><button class="btn btn-primary" type="submit" id="submit-btn">ログイン</button></form></div></section>
<script type="module">
  import { signIn } from '../js/auth.js';
  import { supabase } from '../js/supabase.js';

  const form = document.getElementById('admin-login-form');
  const errorMsg = document.getElementById('error-msg');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'ログイン中...';

    try {
      const data = await signIn({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      });

      const { data: profile } = await supabase
        .from('profiles')
        .select('is_admin')
        .eq('id', data.user.id)
        .maybeSingle();

      if (!profile || !profile.is_admin) {
        throw new Error('管理者権限がありません。');
      }

      window.location.href = 'index.html';
    } catch (err) {
      errorMsg.textContent = err.message === 'Invalid login credentials'
        ? 'メールアドレスまたはパスワードが正しくありません。'
        : err.message;
      errorMsg.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'ログイン';
    }
  });
</script>
</body></html>
