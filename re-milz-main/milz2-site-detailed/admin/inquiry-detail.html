<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>お問い合わせ詳細｜Milz2 Admin</title>
  <meta name="theme-color" content="#00327f" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body" data-admin-current="inquiries">
  <div class="admin-shell">
    <aside class="admin-sidebar">
  <a class="admin-logo" href="index.html">Milz2<small>Admin Console</small></a>
  <nav class="admin-menu">
    <a href="index.html" data-admin="dashboard">ダッシュボード</a>
    <a href="inquiries.html" data-admin="inquiries">お問い合わせ</a>
    <a href="articles.html" data-admin="articles">記事管理</a>
    <a href="users.html" data-admin="users">登録者管理</a>
    <a href="emails.html" data-admin="emails">一括メール</a>
    <div class="sep"></div>
    <a href="jobs.html" data-admin="jobs">求人管理</a>
    <a href="companies.html" data-admin="companies">企業管理</a>
    <a href="checklists.html" data-admin="checklists">チェックリスト</a>
    <a href="analytics.html" data-admin="analytics">分析</a>
    <a href="settings.html" data-admin="settings">設定</a>
    <a href="audit-log.html" data-admin="audit">操作ログ</a>
    <div class="sep"></div>
    <a href="../index.html">公開サイトへ</a>
  </nav>
  <div class="admin-side-note">管理画面はSupabaseに接続されています。</div>
</aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-title"><h1>お問い合わせ詳細</h1><p>Milz2 管理画面</p></div>
        <div class="admin-actions"><a class="btn btn-outline btn-mini" href="inquiries.html">一覧に戻る</a><a class="btn btn-primary btn-mini" href="login.html" id="logout-btn">ログアウト</a><div class="admin-user"><span class="admin-avatar">A</span>Admin</div></div>
      </header>
      <div class="admin-content">
        <section class="admin-grid cols-2">
          <div class="admin-panel">
            <div class="admin-panel-head"><h2 class="admin-panel-title">お問い合わせ詳細</h2><span class="admin-badge" id="status-badge">-</span></div>
            <table class="table">
              <tr><th>氏名</th><td id="inq-name">-</td></tr>
              <tr><th>メール</th><td id="inq-email">-</td></tr>
              <tr><th>カテゴリ</th><td id="inq-category">-</td></tr>
              <tr><th>受付日</th><td id="inq-date">-</td></tr>
            </table>
            <h3 class="admin-panel-title" style="margin-top:22px">相談内容</h3>
            <p class="admin-panel-note" id="inq-message">-</p>
          </div>
          <div class="admin-panel">
            <div class="admin-panel-head"><h2 class="admin-panel-title">ステータス変更</h2></div>
            <form class="admin-form" id="status-form">
              <label>ステータス
                <select id="inq-status">
                  <option value="pending">未対応</option>
                  <option value="reviewing">対応中</option>
                  <option value="resolved">完了</option>
                </select>
              </label>
              <button class="btn btn-primary" type="submit">保存する</button>
            </form>
          </div>
        </section>
      </div>
    </main>
  </div>
<script type="module">
  import { requireAdmin, signOut } from '../js/auth.js';
  import { updateInquiryStatus } from '../js/admin-data.js';
  import { supabase } from '../js/supabase.js';

  const current = document.body.dataset.adminCurrent;
  document.querySelectorAll('[data-admin]').forEach(a => { if(a.dataset.admin === current) a.classList.add('active'); });

  const statusLabels = { pending: '未対応', reviewing: '対応中', resolved: '完了' };
  const statusColors = { pending: 'red', reviewing: 'orange', resolved: 'green' };

  (async () => {
    const profile = await requireAdmin();
    if (!profile) return;

    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (!id) {
      document.getElementById('inq-name').textContent = 'IDが指定されていません';
      return;
    }

    const { data: inq, error } = await supabase
      .from('inquiries')
      .select('*')
      .eq('id', id)
      .maybeSingle();

    if (error || !inq) {
      document.getElementById('inq-name').textContent = 'お問い合わせが見つかりません';
      return;
    }

    document.getElementById('inq-name').textContent = inq.name || '-';
    document.getElementById('inq-email').textContent = inq.email || '-';
    document.getElementById('inq-category').textContent = inq.category || '-';
    document.getElementById('inq-date').textContent = inq.created_at ? new Date(inq.created_at).toLocaleString('ja-JP') : '-';
    document.getElementById('inq-message').textContent = inq.message || inq.title || '-';
    document.getElementById('inq-status').value = inq.status;

    const badge = document.getElementById('status-badge');
    badge.textContent = statusLabels[inq.status] || inq.status;
    badge.className = `admin-badge ${statusColors[inq.status] || ''}`;

    document.getElementById('status-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newStatus = document.getElementById('inq-status').value;
      await updateInquiryStatus(id, newStatus);
      badge.textContent = statusLabels[newStatus];
      badge.className = `admin-badge ${statusColors[newStatus] || ''}`;
      alert('保存しました');
    });
  })();

  document.getElementById('logout-btn')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await signOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
