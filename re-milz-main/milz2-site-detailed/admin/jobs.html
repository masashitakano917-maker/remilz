<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>求人管理｜Milz2 Admin</title>
  <meta name="theme-color" content="#00327f" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body" data-admin-current="jobs">
  <div class="admin-shell">
    <aside class="admin-sidebar">
  <a class="admin-logo" href="index.html">Milz2<small>Admin Console</small></a>
  <nav class="admin-menu">
    <a href="index.html" data-admin="dashboard">ダッシュボード</a>
    <a href="inquiries.html" data-admin="inquiries">お問い合わせ</a>
    <a href="articles.html" data-admin="articles">記事管理</a>
    <a href="users.html" data-admin="users">登録者管理</a>
    <a href="emails.html" data-admin="emails">一括メール</a>
    <div class="sep"></div>
    <a href="jobs.html" data-admin="jobs">求人管理</a>
    <a href="companies.html" data-admin="companies">企業管理</a>
    <a href="checklists.html" data-admin="checklists">チェックリスト</a>
    <a href="analytics.html" data-admin="analytics">分析</a>
    <a href="settings.html" data-admin="settings">設定</a>
    <a href="audit-log.html" data-admin="audit">操作ログ</a>
    <div class="sep"></div>
    <a href="../index.html">公開サイトへ</a>
  </nav>
  <div class="admin-side-note">管理画面はSupabaseに接続されています。</div>
</aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-title"><h1>求人管理</h1><p>Milz2 管理画面</p></div>
        <div class="admin-actions"><a class="btn btn-outline btn-mini" href="settings.html">設定</a><a class="btn btn-primary btn-mini" href="login.html">ログアウト</a><div class="admin-user"><span class="admin-avatar">A</span>Admin</div></div>
      </header>
      <div class="admin-content">
        <section class="admin-panel"><div class="admin-toolbar"><div class="admin-tabs"><a class="admin-tab active" href="#">公開中</a><a class="admin-tab" href="#">下書き</a><a class="admin-tab" href="#">掲載終了</a></div><a class="btn btn-primary btn-mini" href="job-edit.html">求人を追加</a></div><table class="admin-table"><tr><th>求人名</th><th>企業</th><th>勤務地</th><th>状態</th><th>応募</th><th></th></tr></table></section>
      </div>
    </main>
  </div>
<script type="module">
  import { requireAdmin, signOut } from '../js/auth.js';
  import { getAllJobs, deleteJob, updateJob } from '../js/admin-data.js';

  const current = document.body.dataset.adminCurrent;
  document.querySelectorAll('[data-admin]').forEach(a => { if(a.dataset.admin === current) a.classList.add('active'); });

  let currentStatus = 'published';

  (async () => {
    const profile = await requireAdmin();
    if (!profile) return;
    loadJobs();
  })();

  const tabs = document.querySelectorAll('.admin-tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', (e) => {
      e.preventDefault();
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const text = tab.textContent;
      if (text === '公開中') currentStatus = 'published';
      else if (text === '下書き') currentStatus = 'draft';
      else currentStatus = 'ended';
      loadJobs();
    });
  });

  async function loadJobs() {
    const table = document.querySelector('.admin-table');
    try {
      const jobs = await getAllJobs({ status: currentStatus });
      const statusLabel = { published: '公開', draft: '下書き', ended: '終了' };
      const statusColor = { published: 'green', draft: '', ended: 'orange' };
      table.innerHTML = `<tr><th>求人名</th><th>企業</th><th>勤務地</th><th>状態</th><th>応募</th><th></th></tr>` +
        jobs.map(job => `<tr>
          <td>${job.title}</td>
          <td>${job.company_name}</td>
          <td>${job.location || ''}</td>
          <td><span class="admin-badge ${statusColor[job.status] || ''}">${statusLabel[job.status] || job.status}</span></td>
          <td>${job.application_count}</td>
          <td class="right"><a href="job-edit.html?id=${job.id}">編集</a></td>
        </tr>`).join('');
      if (jobs.length === 0) {
        table.innerHTML += '<tr><td colspan="6" style="text-align:center;padding:24px;color:var(--muted)">該当する求人がありません</td></tr>';
      }
    } catch (e) {
      table.innerHTML = '<tr><td colspan="6" style="color:var(--red)">読み込みエラー</td></tr>';
    }
  }

  document.querySelector('.admin-actions .btn-primary')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await signOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
