<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>求人追加・編集｜CHAPTER JAPAN Admin</title>
  <meta name="theme-color" content="#00327f" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body" data-admin-current="jobs">
  <div class="admin-shell">
    <aside class="admin-sidebar">
  <a class="admin-logo" href="index.html">CHAPTER JAPAN<small>Admin Console</small></a>
  <nav class="admin-menu">
    <a href="index.html" data-admin="dashboard">ダッシュボード</a>
    <a href="inquiries.html" data-admin="inquiries">お問い合わせ</a>
    <a href="articles.html" data-admin="articles">記事管理</a>
    <a href="users.html" data-admin="users">登録者管理</a>
    <a href="emails.html" data-admin="emails">一括メール</a>
    <div class="sep"></div>
    <a href="jobs.html" data-admin="jobs">求人管理</a>
    <a href="companies.html" data-admin="companies">企業管理</a>
    <a href="checklists.html" data-admin="checklists">チェックリスト</a>
    <a href="analytics.html" data-admin="analytics">分析</a>
    <a href="settings.html" data-admin="settings">設定</a>
    <a href="audit-log.html" data-admin="audit">操作ログ</a>
    <div class="sep"></div>
    <a href="../index.html">公開サイトへ</a>
  </nav>
  <div class="admin-side-note">管理画面はSupabaseに接続されています。</div>
</aside>
    <main class="admin-main">
      <header class="admin-topbar">
        <div class="admin-title"><h1 id="page-title">求人追加</h1><p>CHAPTER JAPAN 管理画面</p></div>
        <div class="admin-actions"><a class="btn btn-outline btn-mini" href="jobs.html">戻る</a><a class="btn btn-primary btn-mini" id="logout-btn" href="#">ログアウト</a></div>
      </header>
      <div class="admin-content">
        <section class="admin-panel"><div class="admin-panel-head"><h2 class="admin-panel-title">求人編集</h2></div>
        <div id="msg" style="display:none;padding:12px;border-radius:6px;margin-bottom:16px;font-size:14px"></div>
        <form class="admin-form" id="job-form">
          <label>求人タイトル<input id="title" required></label>
          <div class="admin-form-grid">
            <label>企業名<input id="company_name" required></label>
            <label>雇用形態<select id="employment_type"><option value="正社員">正社員</option><option value="契約社員">契約社員</option><option value="業務委託">業務委託</option></select></label>
            <label>勤務地<input id="location"></label>
            <label>最低年収 (万円)<input type="number" id="salary_min"></label>
            <label>最高年収 (万円)<input type="number" id="salary_max"></label>
            <label>ステータス<select id="status"><option value="draft">下書き</option><option value="published">公開</option><option value="ended">掲載終了</option></select></label>
          </div>
          <label>タグ (カンマ区切り)<input id="tags" placeholder="英語使用, 帰国者歓迎, 海外経験歓迎"></label>
          <label>仕事内容 (1行1項目)<textarea id="duties" rows="4"></textarea></label>
          <label>応募条件 (1行1項目)<textarea id="requirements" rows="4"></textarea></label>
          <label>募集概要<textarea id="description" rows="3"></textarea></label>
          <label>選考フロー<input id="selection_flow"></label>
          <label class="check"><input type="checkbox" id="online_interview"> オンライン面談可</label>
          <button class="btn btn-primary" type="submit" id="submit-btn">保存する</button>
        </form></section>
      </div>
    </main>
  </div>
<script type="module">
  import { requireAdmin, signOut } from '../js/auth.js';
  import { createJob, updateJob } from '../js/admin-data.js';
  import { supabase } from '../js/supabase.js';

  const current = document.body.dataset.adminCurrent;
  document.querySelectorAll('[data-admin]').forEach(a => { if(a.dataset.admin === current) a.classList.add('active'); });

  const params = new URLSearchParams(window.location.search);
  const jobId = params.get('id');
  const form = document.getElementById('job-form');
  const msg = document.getElementById('msg');

  (async () => {
    const profile = await requireAdmin();
    if (!profile) return;

    if (jobId) {
      document.getElementById('page-title').textContent = '求人編集';
      const { data: job } = await supabase.from('jobs').select('*').eq('id', jobId).maybeSingle();
      if (job) {
        document.getElementById('title').value = job.title;
        document.getElementById('company_name').value = job.company_name;
        document.getElementById('employment_type').value = job.employment_type;
        document.getElementById('location').value = job.location || '';
        document.getElementById('salary_min').value = job.salary_min || '';
        document.getElementById('salary_max').value = job.salary_max || '';
        document.getElementById('status').value = job.status;
        document.getElementById('tags').value = (job.tags || []).join(', ');
        document.getElementById('duties').value = (job.duties || []).join('\n');
        document.getElementById('requirements').value = (job.requirements || []).join('\n');
        document.getElementById('description').value = job.description || '';
        document.getElementById('selection_flow').value = job.selection_flow || '';
        document.getElementById('online_interview').checked = job.online_interview;
      }
    }
  })();

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    msg.style.display = 'none';
    const submitBtn = document.getElementById('submit-btn');
    submitBtn.disabled = true;

    const jobData = {
      title: document.getElementById('title').value,
      company_name: document.getElementById('company_name').value,
      employment_type: document.getElementById('employment_type').value,
      location: document.getElementById('location').value,
      salary_min: parseInt(document.getElementById('salary_min').value) || null,
      salary_max: parseInt(document.getElementById('salary_max').value) || null,
      status: document.getElementById('status').value,
      tags: document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean),
      duties: document.getElementById('duties').value.split('\n').filter(Boolean),
      requirements: document.getElementById('requirements').value.split('\n').filter(Boolean),
      description: document.getElementById('description').value,
      selection_flow: document.getElementById('selection_flow').value,
      online_interview: document.getElementById('online_interview').checked,
      published_at: document.getElementById('status').value === 'published' ? new Date().toISOString() : null
    };

    try {
      if (jobId) {
        await updateJob(jobId, jobData);
      } else {
        await createJob(jobData);
      }
      msg.style.display = 'block';
      msg.style.color = 'var(--green)';
      msg.style.background = 'var(--green-bg)';
      msg.textContent = '保存しました。';
      setTimeout(() => { window.location.href = 'jobs.html'; }, 1000);
    } catch (err) {
      msg.style.display = 'block';
      msg.style.color = 'var(--red)';
      msg.style.background = '#fef2f2';
      msg.textContent = `保存に失敗しました: ${err.message}`;
      submitBtn.disabled = false;
    }
  });

  document.getElementById('logout-btn')?.addEventListener('click', async (e) => {
    e.preventDefault();
    await signOut();
    window.location.href = 'login.html';
  });
</script>
</body>
</html>
